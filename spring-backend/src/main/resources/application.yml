server:
  port: 5000

spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://yashkurangale910_db_user:Qcd7wz9sCyhdu9UV@cluster0.wnwdfmo.mongodb.net/focusflow?retryWrites=true&w=majority}
  jackson:
    default-property-inclusion: non_null  # Don't serialize null fields
    serialization:
      write-dates-as-timestamps: false     # ISO-8601 date format

jwt:
  secret: ${JWT_SECRET:focusflow-super-secret-key-2024}
  expiration-ms: 604800000  # 7 days

ai:
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini

# --- Logging ---
logging:
  level:
    com.focusflow: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} — %msg%n"

# --- Actuator (Production Readiness) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: FocusFlow AI Backend
    description: Neural Productivity Platform API
    version: 1.1.0
    framework: Spring Boot 3.2.5
    java: 17
